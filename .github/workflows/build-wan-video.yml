name: Build encrypted Wan Animate GPU worker

on:
  push:
    branches:
      - feature/wan-video-gpu-worker
    paths:
      - worker/wan/**
      - .github/workflows/build-wan-video.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate handler syntax
        run: python3 -m py_compile worker/wan/secure_handler.py
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish encrypted GPU container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/wan/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jlock003/wan-animate-secure:pilot
          cache-from: type=gha,scope=wan-secure
          cache-to: type=gha,scope=wan-secure,mode=min
          provenance: false
